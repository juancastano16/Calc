<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sumas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-6">
        <h1 class="text-2xl font-bold text-gray-800 text-center">Calculadora de Sumas</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Pega tus números (separados por coma, espacio o salto de línea)</label>
                <textarea id="numberInput" rows="4" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="Ej: 10, 20.5, 30..."></textarea>
            </div>
            <div class="bg-indigo-50 rounded-xl p-4 text-center">
                <p class="text-sm text-indigo-600 font-medium mb-1">Total</p>
                <p id="totalSum" class="text-4xl font-bold text-indigo-700">0</p>
                <div class="mt-2 flex justify-center space-x-4 text-xs text-gray-500">
                    <p>Datos válidos: <span id="validCount" class="font-semibold text-gray-700">0</span></p>
                    <p>Promedio: <span id="average" class="font-semibold text-gray-700">0</span></p>
                </div>
            </div>
        </div>
        <button onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
            Calcular
        </button>
    </div>

    <script>
        function calculate() {
            const input = document.getElementById('numberInput').value;
            const numbers = input.split(/[\s,]+/).map(n => parseFloat(n)).filter(n => !isNaN(n));
            
            const sum = numbers.reduce((acc, curr) => acc + curr, 0);
            const count = numbers.length;
            const avg = count > 0 ? (sum / count) : 0;

            document.getElementById('totalSum').innerText = sum.toLocaleString('es-CO');
            document.getElementById('validCount').innerText = count;
            document.getElementById('average').innerText = avg.toLocaleString('es-CO', { maximumFractionDigits: 2 });
        }

        document.getElementById('numberInput').addEventListener('input', calculate);
    </script>
</body>
</html>
